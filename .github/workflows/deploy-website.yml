name: Deploy Rafiq Prayer Website

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "privacy.html"
      - "favicon.svg"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Check website files
        run: |
          test -s index.html
          test -s privacy.html
          test -s favicon.svg
          grep -q 'lang="ar" dir="rtl"' index.html
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
